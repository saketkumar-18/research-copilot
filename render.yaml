services:
  - type: web
    name: research-copilot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://api.tokenrouter.com/v1
      - key: LLM_MODEL
        value: qwen/qwen3.8-max-free
      - key: LLM_TIMEOUT_S
        value: "300"
      - key: MAX_REVISION_ROUNDS
        value: "1"
      - key: JOBS_DIR
        value: /opt/render/project/data/jobs
